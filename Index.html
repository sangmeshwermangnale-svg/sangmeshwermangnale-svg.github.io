<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Komal Mangnale | Portfolio</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
scroll-behavior:smooth;
}

body{
background:linear-gradient(135deg,#1e3c72,#2a5298);
color:white;
}

header{
text-align:center;
padding:40px 20px;
}

header img{
width:170px;
height:170px;
border-radius:50%;
border:6px solid white;
box-shadow:0 0 20px cyan;
object-fit:cover;
transition:.5s;
}

header img:hover{
transform:scale(1.08);
}

h1{
margin-top:15px;
font-size:38px;
}

.tag{
color:#ffd700;
font-size:18px;
margin-top:10px;
}

.btn{
display:inline-block;
margin-top:20px;
padding:12px 28px;
background:#00c853;
color:white;
text-decoration:none;
border-radius:30px;
font-weight:bold;
transition:.3s;
}

.btn:hover{
background:#009624;
transform:scale(1.05);
}

section{
padding:40px 10%;
}

.card{
background:rgba(255,255,255,.12);
padding:25px;
border-radius:20px;
backdrop-filter:blur(10px);
margin-bottom:25px;
}

h2{
margin-bottom:20px;
color:#ffd700;
}

.skill{
background:#444;
border-radius:30px;
margin:15px 0;
overflow:hidden;
}

.skill span{
display:block;
padding:12px;
background:#00e676;
width:0%;
animation:load 2s forwards;
font-weight:bold;
}

.html{width:95%;}
.css{width:90%;}
.js{width:80%;}
.c{width:85%;}
.sql{width:88%;}

@keyframes load{
from{width:0;}
}

.project{
background:white;
color:black;
padding:18px;
border-radius:12px;
margin-top:15px;
font-weight:bold;
transition:.3s;
}

.project:hover{
transform:translateY(-5px);
}

.contact a{
display:block;
margin:12px 0;
padding:14px;
border-radius:10px;
text-decoration:none;
color:white;
font-weight:bold;
text-align:center;
}

.whatsapp{
background:#25D366;
}

.github{
background:black;
}

.linkedin{
background:#0A66C2;
}

.email{
background:#444;
}

footer{
text-align:center;
padding:20px;
background:#111;
margin-top:30px;
}

.dark{
background:#111;
}

.dark .card{
background:#222;
}

.toggle{
position:fixed;
top:20px;
right:20px;
background:white;
color:black;
padding:10px 15px;
border:none;
border-radius:30px;
cursor:pointer;
font-weight:bold;
}

</style>

</head>

<body>

<button class="toggle" onclick="darkMode()">🌙 Dark</button>

<header>

<img src="">

<h1>Komal Mangnale</h1>

<p class="tag">
B.Sc Software Engineering Student
</p>

<a href="#about" class="btn">
Explore Portfolio
</a>

  </header>
